[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionaim"
version = "0.1.0"
description = "Local computer vision prototype for single-player games on Windows 10"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<5", "mss>=9,<11"]

[project.optional-dependencies]
detection = ["ultralytics>=8.3,<9"]
dxcam = ["dxcam>=0.0.5,<0.1; sys_platform == 'win32'"]

[project.scripts]
visionaim = "visionaim.main:main"

[tool.setuptools.packages.find]
include = ["visionaim*"]
